@if (partidaGuardada()) {
    <div class="mision-card-full save-card">
        <div class="card-inner-content">
            <h3 class="mision-titulo">Partida en Curso</h3>
            <div class="mision-meta-row">
                <span class="mision-autor">Misión: {{ partidaGuardada().mision.nombre }}</span>
            </div>
            
            <div class="mision-actions">
                <button (click)="recuperarPartida()" class="btn-ink">REANUDAR</button>
                <button (click)="descartarGuardado()" class="btn-ink">DESCARTAR</button>
            </div>
        </div>
    </div>
}
<div class="mision-card-full save-card" routerLink="/forjar-aventura">
  <div class="card-inner-content">
        <h3 class="mision-titulo">CREADOR DE MISIONES</h3>
        <div class="mision-meta-row">
            <span class="mision-autor">Crear una aventura manual personalizada</span>
        </div>
        
        <div class="mision-actions">
            <button class="btn-ink">FORJAR AVENTURA</button>
        </div>
    </div>
</div>
