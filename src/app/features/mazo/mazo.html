<div class="mazo-container">
  <header class="mazo-header">
    <div class="stats">
      <div class="stat-item robo">
        <i class="fa-solid fa-scroll"></i> 
        <span>{{ pilaRobo().length }}</span>
      </div>
      <div class="stat-item descarte">
        <i class="fa-solid fa-skull"></i> 
        <span>{{ pilaDescarte().length }}</span>
      </div>
    </div>
  </header>
  <section class="descarte-viewer">
    <h3>HISTORIAL DE DESCARTES</h3>
    
    @if (pilaDescarte().length > 0) {
      <div class="viewer-controls">
        <button class="nav-arrow" (click)="cambiarIndice(-1)" [disabled]="indiceDescarte() === 0">
          <i class="fas fa-chevron-left"></i>
        </button>

        <div class="card-display">
          <div class="card-mini">
            <div class="card-artwork">
              <img [src]="pilaDescarte()[indiceDescarte()].imagen" alt="Carta">
            </div>
          </div>
          <div class="card-counter">
            {{ indiceDescarte() + 1 }} / {{ pilaDescarte().length }}
          </div>
        </div>

        <button class="nav-arrow" (click)="cambiarIndice(1)" [disabled]="indiceDescarte() === pilaDescarte().length - 1">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    } @else {
      <div class="empty-container">
        <p class="empty-msg">El cementerio está vacío.</p>
      </div>
    }
  </section>

  <div class="mazo-actions">
    <button class="btn-stone" (click)="barajarRobo()">
      <i class="fa-solid fa-shuffle"></i> BARAJAR
    </button>
    <button class="btn-stone" (click)="reciclarMazo()">
      <i class="fa-solid fa-recycle"></i> RECICLAR
    </button>
    <button class="btn-stone btn-exit" (click)="salir()">
      <i class="fa-solid fa-door-open"></i> SALIR
    </button>
  </div>
</div>
